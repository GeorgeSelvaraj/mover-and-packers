{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Request Quote | Packers & Movers</title>

    <link rel="stylesheet" href="{% static 'css/mystyle.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f0f6ff;
            margin: 0;
        }

        .contact-hero {
            background: linear-gradient(135deg, #0a0f1e, #0d2052);
            padding: 70px 20px;
            text-align: center;
            color: white;
        }

        .contact-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 50px;
        }

        .contact-hero span {
            color: #38bdf8;
        }

        .quote-wrapper {
            max-width: 560px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .form-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .form-card form {
            text-align: left;
        }

        .form-card h2 {
            text-align: center;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
            color: #1e293b;
        }

        label:first-of-type {
            margin-top: 0;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .btn-send {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            width: 100%;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(14,165,233,0.4);
        }

        .btn-clear {
            background: #e2e8f0;
            color: #1e293b;
            width: 100%;
            margin-top: 10px;
        }

        .btn-clear:hover {
            background: #cbd5e1;
        }
    </style>
</head>

<body>

{% include 'header.html' %}

<div class="contact-hero">
    <h1>Request a <span>Quote</span></h1>
    <p>Tell us about your move — we will get back to you with a tailored estimate</p>
</div>

<div class="quote-wrapper">

    <div class="form-card">
        <h2>Move details</h2>

        <form method="post">
            {% csrf_token %}

            <label>Full name</label>
            <input type="text" name="name" required>

            <label>Contact</label>
            <input type="text" name="contact" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>From location</label>
            <input type="text" name="location" required>

            <label>To location</label>
            <input type="text" name="shifting_location" required>

            <label>Shifting date</label>
            <input type="date" name="shifting_date">

            <label>Select service</label>
            <select name="service" required>
                <option value="">Choose service</option>
                {% for s in services %}
                    <option value="{{ s.id }}">
                        {{ s.title }} (₹{{ s.price }})
                    </option>
                {% endfor %}
            </select>

            <label>Property / load size</label>
            <select name="brief_items">
                <option value="">Select</option>
                <option value="1BHK">1 BHK</option>
                <option value="2BHK">2 BHK</option>
                <option value="3BHK">3 BHK</option>
                <option value="Few Items">Few items</option>
            </select>

            <label>Items details</label>
            <textarea name="items" placeholder="List major items, floor access, parking, etc."></textarea>

            <button class="btn btn-send" type="submit">Submit request</button>
            <button class="btn btn-clear" type="reset">Clear</button>
        </form>
    </div>

</div>

{% if error == "no" %}
<script>
    alert("Your quote request has been submitted!");
    window.location = "{% url 'index' %}";
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Something went wrong. Please try again.");
</script>
{% endif %}

</body>
</html>
