{% extends 'admin_base.html' %}
{% load static %}
{% block main %}

{% if error %}
<script>
    var msg = "{{ error|escapejs }}";
    window.addEventListener('DOMContentLoaded', function() {
        if(msg == "no"){
            showToast('✅ Service added successfully!', 'success');
        } else if(msg == "yes"){
            showToast('❌ Something went wrong!', 'error');
        } else {
            showToast(msg, 'info');
        }
    });
</script>
{% endif %}

<style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    .pm-page {
        font-family: 'Outfit', sans-serif;
        min-height: 100vh;
        background: #f1f5f9;
        padding: 40px 32px;
    }

    /* Page header */
    .pm-page-header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 28px;
        animation: slideDown 0.5s cubic-bezier(.22,1,.36,1) both;
    }
    .pm-page-header .pm-icon-wrap {
        width: 44px; height: 44px;
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 14px rgba(124,58,237,.35);
    }
    .pm-page-header .pm-icon-wrap svg { color: white; width: 20px; height: 20px; }
    .pm-page-header h2 {
        font-size: 22px; font-weight: 700; color: #1e293b;
        letter-spacing: -.3px;
    }
    .pm-page-header p { font-size: 13px; color: #94a3b8; margin-top: 1px; }

    /* Card */
    .pm-card {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 4px 24px rgba(0,0,0,.07);
        overflow: hidden;
        max-width: 680px;
        animation: fadeUp 0.55s cubic-bezier(.22,1,.36,1) 0.08s both;
    }
    .pm-card-stripe {
        height: 5px;
        background: linear-gradient(90deg, #7c3aed, #a855f7, #ec4899);
    }
    .pm-card-body { padding: 36px 40px 40px; }

    /* Form groups */
    .pm-form-group {
        margin-bottom: 22px;
        animation: fadeUp 0.45s cubic-bezier(.22,1,.36,1) both;
    }
    .pm-form-group:nth-child(1) { animation-delay: .12s; }
    .pm-form-group:nth-child(2) { animation-delay: .18s; }
    .pm-form-group:nth-child(3) { animation-delay: .24s; }
    .pm-form-group:nth-child(4) { animation-delay: .30s; }

    .pm-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #475569;
        margin-bottom: 8px;
        letter-spacing: .2px;
        text-transform: uppercase;
    }
    .pm-label span { color: #ef4444; margin-left: 2px; }

    .pm-input, .pm-textarea {
        width: 100%;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 16px;
        font-family: 'Outfit', sans-serif;
        font-size: 15px;
        color: #1e293b;
        background: #f8fafc;
        transition: border-color .25s, box-shadow .25s, background .25s;
        outline: none;
    }
    .pm-input:focus, .pm-textarea:focus {
        border-color: #7c3aed;
        box-shadow: 0 0 0 4px rgba(124,58,237,.12);
        background: #fff;
    }
    .pm-textarea { resize: vertical; min-height: 110px; }

    /* Price field */
    .pm-price-wrap { position: relative; }
    .pm-price-symbol {
        position: absolute;
        left: 14px; top: 50%; transform: translateY(-50%);
        font-size: 16px; font-weight: 700; color: #7c3aed;
        pointer-events: none;
    }
    .pm-price-wrap .pm-input { padding-left: 36px; }

    /* File input */
    .pm-file-label {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1.5px dashed #c4b5fd;
        border-radius: 12px;
        padding: 18px 20px;
        background: #faf5ff;
        cursor: pointer;
        transition: border-color .25s, background .25s;
    }
    .pm-file-label:hover { border-color: #7c3aed; background: #f3e8ff; }
    .pm-file-label .pm-file-icon {
        width: 40px; height: 40px;
        background: linear-gradient(135deg, #7c3aed22, #a855f722);
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
    }
    .pm-file-label .pm-file-icon svg { color: #7c3aed; width: 20px; height: 20px; }
    .pm-file-label .pm-file-text strong {
        display: block; font-size: 14px; font-weight: 600; color: #1e293b;
    }
    .pm-file-label .pm-file-text span { font-size: 12px; color: #94a3b8; }
    .pm-file-input { display: none; }

    /* Submit button */
    .pm-btn-row {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 8px;
        animation: fadeUp 0.45s cubic-bezier(.22,1,.36,1) .36s both;
    }
    .pm-btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 12px 28px;
        border-radius: 12px;
        font-family: 'Outfit', sans-serif;
        font-size: 15px; font-weight: 600;
        cursor: pointer;
        border: none;
        transition: transform .2s, box-shadow .2s, filter .2s;
    }
    .pm-btn:hover { transform: translateY(-2px); }
    .pm-btn:active { transform: translateY(0); }
    .pm-btn-primary {
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        color: white;
        box-shadow: 0 4px 16px rgba(124,58,237,.35);
    }
    .pm-btn-primary:hover { box-shadow: 0 8px 24px rgba(124,58,237,.45); }
    .pm-btn-outline {
        background: transparent;
        color: #64748b;
        border: 1.5px solid #e2e8f0;
    }
    .pm-btn-outline:hover { border-color: #7c3aed; color: #7c3aed; }

    /* Toast */
    .pm-toast {
        position: fixed; top: 24px; right: 24px;
        padding: 14px 22px;
        border-radius: 14px;
        font-family: 'Outfit', sans-serif;
        font-size: 14px; font-weight: 600;
        color: white;
        z-index: 9999;
        display: flex; align-items: center; gap: 10px;
        box-shadow: 0 8px 30px rgba(0,0,0,.15);
        animation: toastIn .4s cubic-bezier(.22,1,.36,1) both;
    }
    .pm-toast.success { background: linear-gradient(135deg, #10b981, #059669); }
    .pm-toast.error   { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .pm-toast.info    { background: linear-gradient(135deg, #7c3aed, #a855f7); }
    .pm-toast.hide    { animation: toastOut .35s ease forwards; }

    /* Keyframes */
    @keyframes slideDown {
        from { opacity:0; transform: translateY(-18px); }
        to   { opacity:1; transform: translateY(0); }
    }
    @keyframes fadeUp {
        from { opacity:0; transform: translateY(22px); }
        to   { opacity:1; transform: translateY(0); }
    }
    @keyframes toastIn {
        from { opacity:0; transform: translateX(60px) scale(.9); }
        to   { opacity:1; transform: translateX(0) scale(1); }
    }
    @keyframes toastOut {
        to { opacity:0; transform: translateX(60px) scale(.9); }
    }

    /* File name preview */
    #file-name-preview {
        font-size: 13px; color: #7c3aed;
        margin-top: 6px; padding-left: 2px;
        display: none;
    }
</style>

<div class="pm-page">
    <!-- Header -->
    <div class="pm-page-header">
        <div class="pm-icon-wrap">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
        </div>
        <div>
            <h2>Add New Service</h2>
            <p>Fill in the details to create a new service offering</p>
        </div>
    </div>

    <!-- Card -->
    <div class="pm-card">
        <div class="pm-card-stripe"></div>
        <div class="pm-card-body">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- Title -->
                <div class="pm-form-group">
                    <label class="pm-label">Service Title <span>*</span></label>
                    <input type="text" name="title" class="pm-input"
                           placeholder="e.g. Local Shifting, Office Relocation…" required>
                </div>

                <!-- Image -->
                <div class="pm-form-group">
                    <label class="pm-label">Service Image <span>*</span></label>
                    <label class="pm-file-label" for="serviceImage">
                        <div class="pm-file-icon">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <div class="pm-file-text">
                            <strong>Click to upload image</strong>
                            <span>PNG, JPG, WEBP up to 5MB</span>
                        </div>
                    </label>
                    <input type="file" id="serviceImage" name="image"
                           class="pm-file-input" accept="image/*" required>
                    <div id="file-name-preview"></div>
                </div>

                <!-- Price -->
                <div class="pm-form-group">
                    <label class="pm-label">Price <span>*</span></label>
                    <div class="pm-price-wrap">
                        <span class="pm-price-symbol">₹</span>
                        <input type="number" name="price" class="pm-input"
                               placeholder="Enter amount" required min="0">
                    </div>
                </div>

                <!-- Description -->
                <div class="pm-form-group">
                    <label class="pm-label">Description</label>
                    <textarea name="description" class="pm-textarea"
                              placeholder="Describe what this service includes…"></textarea>
                </div>

                <!-- Buttons -->
                <div class="pm-btn-row">
                    <button type="reset" class="pm-btn pm-btn-outline">Reset</button>
                    <button type="submit" class="pm-btn pm-btn-primary">
                        <svg width="16" height="16" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                        </svg>
                        Add Service
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
    // File name preview
    document.getElementById('serviceImage').addEventListener('change', function() {
        var preview = document.getElementById('file-name-preview');
        if (this.files && this.files[0]) {
            preview.textContent = '📎 ' + this.files[0].name;
            preview.style.display = 'block';
        }
    });

    // Toast helper
    function showToast(msg, type) {
        var t = document.createElement('div');
        t.className = 'pm-toast ' + type;
        t.innerHTML = (type === 'success' ? '✓ ' : type === 'error' ? '✕ ' : 'ℹ ') + msg;
        document.body.appendChild(t);
        setTimeout(function() {
            t.classList.add('hide');
            setTimeout(function() { t.remove(); }, 400);
        }, 3500);
    }
</script>

{% endblock %}
