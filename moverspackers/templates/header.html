{% load static %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- Bootstrap -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css">

<style>
body{
    font-family: 'Poppins', sans-serif;
    background:#f8f9fa;
}

/* 🔥 NAVBAR GLASS EFFECT */
.navbar{
    background: rgba(10,15,25,0.9);
    backdrop-filter: blur(10px);
    padding: 14px 40px;
    transition: 0.3s;
}

/* LOGO — packers & movers lockup */
.navbar-brand.brand-lockup{
    display: flex !important;
    align-items: center;
    gap: 12px;
    font-size: 1.15rem;
    line-height: 1.15;
    padding: 4px 0;
    text-decoration: none !important;
}

.brand-mark-img{
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 11px;
    box-shadow: 0 2px 12px rgba(255, 140, 0, 0.35);
    transition: transform 0.2s ease;
}

.brand-lockup:hover .brand-mark-img{
    transform: scale(1.05);
}

.brand-names{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
}

.brand-title{
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #fff !important;
    font-size: 1.25rem;
}

.brand-title .brand-accent{
    color: #ffb300 !important;
    font-weight: 800;
    margin-left: 1px;
}

.brand-tagline{
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5) !important;
    line-height: 1;
}

@media (max-width: 380px){
    .brand-tagline{ display: none; }
    .brand-mark-img{ width: 34px; height: 34px; }
}

/* NAV LINKS — scoped to public top bar only (not admin sidebar) */
.navbar.navbar-expand-md.navbar-dark.fixed-top .navbar-nav > .nav-item > .nav-link{
    color: #ccc !important;
    font-size: 17px;
    margin-left: 12px;
    position: relative;
    transition: color 0.25s ease, background 0.25s ease, transform 0.25s ease;
    padding: 8px 18px;
    border-radius: 25px;
    font-weight: 500;
}

/* Same yellow pill hover on every item (cursor follows highlight) */
.navbar.navbar-expand-md.navbar-dark.fixed-top .navbar-nav > .nav-item > .nav-link:hover{
    background: linear-gradient(45deg, #ffb300, #ff8f00);
    color: #1a1a1a !important;
    transform: scale(1.06);
}

/* SHADOW ON SCROLL */
.navbar.scrolled{
    box-shadow:0 5px 20px rgba(0,0,0,0.3);
}
</style>

<nav class="navbar navbar-expand-md navbar-dark fixed-top">

  <a class="navbar-brand brand-lockup" href="{% url 'index' %}">
    <img class="brand-mark-img" src="{% static 'images/logo-secure-shift.svg' %}" width="40" height="40" alt="Secure Shift">
    <span class="brand-names">
      <span class="brand-title">Secure<span class="brand-accent">Shift</span></span>
      <span class="brand-tagline">Packers &amp; Movers</span>
    </span>
  </a>

  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="nav">
    <ul class="navbar-nav ml-auto">

      <li class="nav-item">
        <a class="nav-link" href="{% url 'index' %}">Home</a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="{% url 'services' %}">Services</a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="{% url 'about' %}">About</a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="{% url 'request_quote' %}">Request Quote</a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="{% url 'contact' %}">Contact</a>
      </li>



      <li class="nav-item">
        <a class="nav-link" href="{% url 'admin_login' %}">Admin</a>
      </li>

    </ul>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
window.addEventListener("scroll", function(){
    document.querySelector(".navbar").classList.toggle("scrolled", window.scrollY > 50);
});
</script>
